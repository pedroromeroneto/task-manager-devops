services:
  task-manager:
    image: ghcr.io/pedroromeroneto/task-manager-devops:latest
    container_name: task-manager
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
